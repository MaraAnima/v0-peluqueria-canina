<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TRGROOMING - Pet Grooming</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Home Screen -->
  <section id="home-screen" class="screen active">
    <div class="home-container">
      <div class="home-content">
        <h1 class="logo">
          <span class="logo-tr">TR</span><span class="logo-grooming">GROOMING</span>
        </h1>
        <h2 class="tagline">El cuidado que tu mascota merece</h2>
        <p class="description">Servicios completos y seguros para la higiene de tu mejor amigo.</p>
        
        <button class="cta-button" onclick="startBooking()">
          <div class="dog-icon">
            <svg viewBox="0 0 60 60" class="dog-svg">
              <!-- Dog face -->
              <ellipse cx="30" cy="32" rx="22" ry="20" fill="#fff"/>
              <!-- Ears -->
              <ellipse cx="12" cy="18" rx="8" ry="12" fill="#fff"/>
              <ellipse cx="48" cy="18" rx="8" ry="12" fill="#fff"/>
              <!-- Eyes -->
              <circle cx="22" cy="30" r="4" fill="#1a365d"/>
              <circle cx="38" cy="30" r="4" fill="#1a365d"/>
              <circle cx="23" cy="29" r="1.5" fill="#fff"/>
              <circle cx="39" cy="29" r="1.5" fill="#fff"/>
              <!-- Nose -->
              <ellipse cx="30" cy="38" rx="5" ry="3.5" fill="#1a365d"/>
              <!-- Bubbles on dog -->
              <circle cx="8" cy="8" r="5" fill="#a8d8ea" opacity="0.8"/>
              <circle cx="52" cy="10" r="4" fill="#a8d8ea" opacity="0.8"/>
              <circle cx="55" cy="22" r="3" fill="#a8d8ea" opacity="0.6"/>
            </svg>
          </div>
          <span class="cta-text">Agendar ahora</span>
          <svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </button>
      </div>
      
      <div class="home-image">
        <div class="image-container">
          <img src="images/hero-dog.jpg" alt="Perro feliz siendo banado" class="hero-dog">
        </div>
        <!-- Decorative bubbles -->
        <div class="bubble bubble-1"></div>
        <div class="bubble bubble-2"></div>
        <div class="bubble bubble-3"></div>
        <div class="bubble bubble-4"></div>
        <div class="bubble bubble-5"></div>
      </div>
    </div>
    
    <!-- Floating bubbles animation -->
    <div class="floating-bubbles">
      <div class="float-bubble fb-1"></div>
      <div class="float-bubble fb-2"></div>
      <div class="float-bubble fb-3"></div>
      <div class="float-bubble fb-4"></div>
      <div class="float-bubble fb-5"></div>
      <div class="float-bubble fb-6"></div>
      <div class="float-bubble fb-7"></div>
      <div class="float-bubble fb-8"></div>
    </div>
    
    <!-- Paw prints decoration -->
    <div class="paw-prints">
      <svg class="paw paw-1" viewBox="0 0 50 50">
        <ellipse cx="25" cy="35" rx="12" ry="10" fill="currentColor"/>
        <circle cx="15" cy="18" r="6" fill="currentColor"/>
        <circle cx="35" cy="18" r="6" fill="currentColor"/>
        <circle cx="8" cy="28" r="5" fill="currentColor"/>
        <circle cx="42" cy="28" r="5" fill="currentColor"/>
      </svg>
      <svg class="paw paw-2" viewBox="0 0 50 50">
        <ellipse cx="25" cy="35" rx="12" ry="10" fill="currentColor"/>
        <circle cx="15" cy="18" r="6" fill="currentColor"/>
        <circle cx="35" cy="18" r="6" fill="currentColor"/>
        <circle cx="8" cy="28" r="5" fill="currentColor"/>
        <circle cx="42" cy="28" r="5" fill="currentColor"/>
      </svg>
      <svg class="paw paw-3" viewBox="0 0 50 50">
        <ellipse cx="25" cy="35" rx="12" ry="10" fill="currentColor"/>
        <circle cx="15" cy="18" r="6" fill="currentColor"/>
        <circle cx="35" cy="18" r="6" fill="currentColor"/>
        <circle cx="8" cy="28" r="5" fill="currentColor"/>
        <circle cx="42" cy="28" r="5" fill="currentColor"/>
      </svg>
    </div>
    
    <!-- Soap bubbles -->
    <div class="soap-bubble sb-1"></div>
    <div class="soap-bubble sb-2"></div>
    <div class="soap-bubble sb-3"></div>
    <div class="soap-bubble sb-4"></div>
    <div class="soap-bubble sb-5"></div>
    
    <!-- Bone decorations -->
    <div class="bone-deco bone-1"><span></span></div>
    <div class="bone-deco bone-2"><span></span></div>
    
    <!-- Water splash effect -->
    <div class="water-splash"></div>
  </section>

  <!-- Booking Flow -->
  <section id="booking-screen" class="screen">
    <div class="booking-container">
      <!-- Header -->
      <header class="booking-header">
        <button class="back-button" onclick="goBack()">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M19 12H5M12 19l-7-7 7-7"/>
          </svg>
        </button>
      </header>

      <!-- Progress Steps Bar -->
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-steps">
          <!-- Steps will be generated by JS -->
        </div>
        <div class="progress-wave">
          <svg viewBox="0 0 1200 120" preserveAspectRatio="none">
            <path d="M321.39,56.44c58-10.79,114.16-30.13,172-41.86,82.39-16.72,168.19-17.73,250.45-.39C823.78,31,906.67,72,985.66,92.83c70.05,18.48,146.53,26.09,214.34,3V0H0V27.35A600.21,600.21,0,0,0,321.39,56.44Z" fill="var(--accent-cyan)"/>
          </svg>
        </div>
      </div>

      <!-- Step Content -->
      <main class="step-content" id="step-content">
        <!-- Dynamic content -->
      </main>
    </div>
    
    <!-- Background bubbles -->
    <div class="bg-bubbles">
      <div class="bg-bubble bg-b1"></div>
      <div class="bg-bubble bg-b2"></div>
      <div class="bg-bubble bg-b3"></div>
    </div>
  </section>

  <!-- Confirmation Screen -->
  <section id="confirmation-screen" class="screen">
    <div class="confirmation-container">
      <div class="success-animation">
        <div class="checkmark-circle">
          <svg class="checkmark" viewBox="0 0 52 52">
            <circle cx="26" cy="26" r="25" fill="none" stroke="#43c7cd" stroke-width="2"/>
            <path fill="none" stroke="#43c7cd" stroke-width="3" d="M14 27l7 7 16-16"/>
          </svg>
        </div>
        <div class="confetti"></div>
      </div>
      <h2 class="success-title">Reserva Confirmada!</h2>
      <p class="success-message">Te enviamos los detalles por WhatsApp</p>
      <button class="new-booking-btn" onclick="resetBooking()">Nueva Reserva</button>
    </div>
  </section>

  <script src="app.js"></script>
</body>
</html>
